<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA;text-decoration:none}a:hover{color:#3730A3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 12px 12px 8px; display: flex; align-items: center; gap: 4px">
    <a href="Main.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0F172A">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.01em">Spring Charity Gala</h1>
  </header>

  <nav aria-label="Project views" style="margin: 0 20px 8px; padding: 4px; background: #E9ECF1; border-radius: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
    <a href="Project.dc.html" style="min-height: 36px; border-radius: 9px; color: #475569; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center">Overview</a>
    <a href="Checklist.dc.html" style="min-height: 36px; border-radius: 9px; color: #475569; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center">Checklist</a>
    <a href="Timeline.dc.html" aria-current="page" style="min-height: 36px; border-radius: 9px; background: #FFFFFF; color: #0F172A; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(15,23,42,0.08)">Timeline</a>
  </nav>

  <div style="padding: 4px 20px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
    <div role="group" aria-label="Zoom" style="display: flex; border: 1px solid #CBD5E1; border-radius: 10px; overflow: hidden">
      <button onClick="{{ zoomWeek }}" aria-pressed="{{ weekPressed }}" style="{{ weekStyle }}">Weeks</button>
      <button onClick="{{ zoomMonth }}" aria-pressed="{{ monthPressed }}" style="{{ monthStyle }}">Months</button>
    </div>
    <button onClick="{{ toggleCritical }}" aria-pressed="{{ criticalPressed }}" style="{{ criticalStyle }}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg>
      Critical path
    </button>
  </div>

  <main style="flex: 1; overflow: auto; margin: 0 12px 12px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 1px 2px rgba(15,23,42,0.06)">
    <div style="{{ gridStyle }}">
      <div style="position: sticky; top: 0; z-index: 3; display: flex; height: 36px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0">
        <div style="position: sticky; left: 0; z-index: 4; width: 132px; flex: none; background: #FFFFFF; font-size: 12px; font-weight: 600; color: #475569; display: flex; align-items: center; padding-left: 12px; box-sizing: border-box">Task</div>
        <div style="{{ scaleStyle }}">
          <sc-for list="{{ ticks }}" as="tk" hint-placeholder-count="6">
            <span style="{{ tk.style }}">{{ tk.label }}</span>
          </sc-for>
        </div>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
        <div style="{{ r.rowStyle }}">
          <div style="{{ r.labelStyle }}">{{ r.label }}</div>
          <div style="{{ r.trackStyle }}">
            <span style="{{ r.todayStyle }}"></span>
            <sc-if value="{{ r.hasGhost }}" hint-placeholder-val="{{ false }}">
              <span style="{{ r.ghostStyle }}"></span>
            </sc-if>
            <sc-if value="{{ r.isBar }}" hint-placeholder-val="{{ true }}">
              <span style="{{ r.barStyle }}"><span style="{{ r.fillStyle }}"></span></span>
            </sc-if>
            <sc-if value="{{ r.milestone }}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 24 24" style="{{ r.diamondPos }}" aria-hidden="true"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"></path></svg>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
  </main>

  <div style="padding: 0 20px 16px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #334155">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 8px; border-radius: 4px; background: #4F46E5"></span>Scheduled</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 8px; border-radius: 4px; border: 1.5px dashed #64748B; box-sizing: border-box"></span>Original plan</span>
    <span style="display: flex; align-items: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l9.5 9.5-9.5 9.5L2.5 12z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.4"></path></svg>Milestone</span>
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 2px; height: 12px; background: #DC2626"></span>Today</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { zoom: 'week', critical: false };
  }
  renderVals() {
    var self = this;
    var px = this.state.zoom === 'week' ? 7 : 2.4;
    var days = 104;
    var today = 11;
    var width = Math.round(days * px) + 16;
    var colors = { P1: '#4F46E5', P2: '#B45309', P3: '#0E7490', P4: '#BE185D' };
    var items = [
      { phase: 'P1', label: 'Venue and budget', header: true },
      { phase: 'P1', label: 'Set the budget', s: 0, d: 2, done: 1, crit: true },
      { phase: 'P1', label: 'Book the venue', s: 2, d: 10, bs: 2, bd: 6, done: 0.7, crit: true },
      { phase: 'P1', label: 'Venue confirmed', s: 12, milestone: true, crit: true },
      { phase: 'P2', label: 'Sponsors and tickets', header: true },
      { phase: 'P2', label: 'Sponsor packet', s: 0, d: 3, done: 1 },
      { phase: 'P2', label: 'Pitch businesses', s: 3, d: 14, done: 0.5 },
      { phase: 'P2', label: 'Ticket sales', s: 13, d: 70, bs: 9, bd: 70, done: 0, crit: true },
      { phase: 'P3', label: 'Food and program', header: true },
      { phase: 'P3', label: 'Shortlist caterers', s: 13, d: 7, bs: 9, bd: 7, done: 0, crit: true },
      { phase: 'P3', label: 'Book a speaker', s: 10, d: 14, done: 0 },
      { phase: 'P3', label: 'Menu tasting', s: 30, d: 3, done: 0 },
      { phase: 'P4', label: 'Event week', header: true },
      { phase: 'P4', label: 'Final headcount', s: 90, d: 4, done: 0, crit: true },
      { phase: 'P4', label: 'Gala night', s: 103, milestone: true, crit: true },
      { phase: 'P4', label: 'Thank-you notes', s: 104, d: 0, done: 0 }
    ];
    var crit = this.state.critical;
    var rows = items.map(function (it) {
      var c = colors[it.phase];
      var dim = crit && !it.crit && !it.header;
      var base = { label: it.label, hasGhost: false, isBar: false, milestone: false };
      base.rowStyle = 'display: flex; height: ' + (it.header ? 34 : 40) + 'px; border-bottom: 1px solid #F1F5F9;' + (it.header ? ' background: #F8FAFC;' : '');
      base.labelStyle = 'position: sticky; left: 0; z-index: 2; width: 132px; flex: none; box-sizing: border-box; padding: 0 8px 0 12px; display: flex; align-items: center; font-size: ' + (it.header ? '12px; font-weight: 700; color: ' + c + '; text-transform: uppercase; letter-spacing: 0.03em;' : '13px; color: ' + (dim ? '#94A3B8' : '#0F172A') + ';') + ' background: ' + (it.header ? '#F8FAFC' : '#FFFFFF') + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;' + (it.header ? '' : ' border-left: 4px solid ' + c + ';');
      base.trackStyle = 'position: relative; flex: none; width: ' + width + 'px;';
      base.todayStyle = 'position: absolute; top: 0; bottom: 0; left: ' + Math.round(today * px + 8) + 'px; width: 2px; background: #DC2626; opacity: 0.85;';
      if (it.header) return base;
      if (it.milestone) {
        base.milestone = true;
        base.diamondPos = 'position: absolute; top: 11px; left: ' + Math.round(it.s * px - 1) + 'px;' + (dim ? ' opacity: 0.35;' : '');
        return base;
      }
      var w = Math.max(6, Math.round(Math.max(it.d, 0.6) * px));
      base.isBar = true;
      var ring = crit && it.crit ? ' box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #0F172A;' : '';
      base.barStyle = 'position: absolute; top: 13px; height: 14px; border-radius: 7px; overflow: hidden; left: ' + Math.round(it.s * px + 8) + 'px; width: ' + w + 'px; background: ' + c + '33;' + (dim ? ' opacity: 0.35;' : '') + ring;
      base.fillStyle = 'display: block; height: 100%; width: ' + Math.round(it.done * 100) + '%; background: ' + c + ';';
      if (it.bs !== undefined) {
        base.hasGhost = true;
        base.ghostStyle = 'position: absolute; top: 10px; height: 20px; border-radius: 9px; border: 1.5px dashed #64748B; box-sizing: border-box; left: ' + Math.round(it.bs * px + 8) + 'px; width: ' + Math.round(it.bd * px) + 'px;';
      }
      return base;
    });
    var ticks = [];
    var weekLabels = ['Dec 1', 'Dec 8', 'Dec 15', 'Dec 22', 'Dec 29', 'Jan 5', 'Jan 12', 'Jan 19', 'Jan 26', 'Feb 2', 'Feb 9', 'Feb 16', 'Feb 23', 'Mar 2', 'Mar 9'];
    if (this.state.zoom === 'week') {
      weekLabels.forEach(function (l, i) {
        ticks.push({ label: l, style: 'position: absolute; top: 0; height: 36px; display: flex; align-items: center; font-size: 11px; color: #475569; border-left: 1px solid #E2E8F0; padding-left: 4px; left: ' + Math.round(i * 7 * px + 8) + 'px;' });
      });
    } else {
      [['Dec', 0], ['Jan', 31], ['Feb', 62], ['Mar', 90]].forEach(function (m) {
        ticks.push({ label: m[0], style: 'position: absolute; top: 0; height: 36px; display: flex; align-items: center; font-size: 11px; color: #475569; border-left: 1px solid #E2E8F0; padding-left: 4px; left: ' + Math.round(m[1] * px + 8) + 'px;' });
      });
    }
    var segOn = 'min-height: 36px; padding: 0 14px; border: none; background: #0F172A; color: #FFFFFF; font: 600 13px Inter, sans-serif; cursor: pointer;';
    var segOff = 'min-height: 36px; padding: 0 14px; border: none; background: #FFFFFF; color: #334155; font: 600 13px Inter, sans-serif; cursor: pointer;';
    return {
      rows: rows,
      ticks: ticks,
      gridStyle: 'width: ' + (width + 132) + 'px; position: relative;',
      scaleStyle: 'position: relative; flex: none; width: ' + width + 'px;',
      zoomWeek: function () { self.setState({ zoom: 'week' }); },
      zoomMonth: function () { self.setState({ zoom: 'month' }); },
      weekPressed: this.state.zoom === 'week' ? 'true' : 'false',
      monthPressed: this.state.zoom === 'month' ? 'true' : 'false',
      weekStyle: this.state.zoom === 'week' ? segOn : segOff,
      monthStyle: this.state.zoom === 'month' ? segOn : segOff,
      toggleCritical: function () { self.setState({ critical: !self.state.critical }); },
      criticalPressed: crit ? 'true' : 'false',
      criticalStyle: 'min-height: 38px; padding: 0 12px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; font: 600 13px Inter, sans-serif; cursor: pointer; ' + (crit ? 'background: #0F172A; color: #FFFFFF; border: 1px solid #0F172A;' : 'background: #FFFFFF; color: #334155; border: 1px solid #CBD5E1;')
    };
  }
}
</script>
</body>
</html>
