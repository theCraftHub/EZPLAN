<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to EZPLAN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA;text-decoration:none}a:hover{color:#3730A3}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F7F9; font-family: Inter, system-ui, sans-serif; color: #0F172A; display: flex; flex-direction: column; overflow: hidden">
  <main style="flex: 1; overflow-y: auto; padding: 48px 24px 24px; display: flex; flex-direction: column; gap: 18px">
    <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.03em; color: #4338CA">EZPLAN</span>

    <sc-if value="{{ isQ }}" hint-placeholder-val="{{ true }}">
      <section style="display: flex; flex-direction: column; gap: 16px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">What are you planning?</h1>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #334155">
          Give it a name
          <input type="text" value="Kitchen renovation" style="min-height: 48px; padding: 0 12px; border: 1px solid #CBD5E1; border-radius: 12px; font: 400 16px Inter, sans-serif; color: #0F172A; background: #FFFFFF">
        </label>
        <span style="font-size: 15px; font-weight: 600; padding-top: 4px">How do you want to start?</span>
        <sc-for list="{{ options }}" as="o" hint-placeholder-count="3">
          <button onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="{{ o.style }}">
            <span style="font-size: 16px; font-weight: 600; color: #0F172A">{{ o.title }}</span>
            <span style="font-size: 13px; line-height: 1.45; color: #475569">{{ o.sub }}</span>
          </button>
        </sc-for>
        <button onClick="{{ go }}" style="min-height: 52px; border-radius: 14px; border: none; background: #4F46E5; color: #FFFFFF; font: 600 16px Inter, sans-serif; cursor: pointer">Continue</button>
      </section>
    </sc-if>

    <sc-if value="{{ isTour }}" hint-placeholder-val="{{ false }}">
      <section style="display: flex; flex-direction: column; gap: 16px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Your plan is ready</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #334155">A quick tour, 4 steps. You can skip it and find it again under Help.</p>
        <sc-for list="{{ tour }}" as="t" hint-placeholder-count="4">
          <div style="background: #FFFFFF; border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(15,23,42,0.06); display: flex; gap: 12px; align-items: center">
            <span style="width: 32px; height: 32px; border-radius: 16px; background: #EEF2FF; color: #3730A3; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">{{ t.n }}</span>
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; font-weight: 600">{{ t.title }}</span>
              <span style="font-size: 13px; color: #475569">{{ t.sub }}</span>
            </div>
          </div>
        </sc-for>
        <a href="Checklist.dc.html" style="min-height: 52px; border-radius: 14px; background: #4F46E5; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Start the tour</a>
        <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">Skip for now</a>
      </section>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'ai', done: false };
  }
  renderVals() {
    var self = this;
    var opts = [
      { k: 'ai', title: 'Use my AI assistant', sub: 'Copy a prompt into any AI you use (ChatGPT, Claude, Gemini, Copilot…), paste back its reply.' },
      { k: 'tpl', title: 'Start from a template', sub: 'Ready-made plans: renovation, event, move, launch, hiring and more. No AI needed.' },
      { k: 'imp', title: 'Import a file', sub: 'An .ezplan file, a checklist, or a spreadsheet from Asana, Trello or Excel.' }
    ];
    return {
      isQ: !this.state.done,
      isTour: this.state.done,
      options: opts.map(function (o) {
        var on = self.state.pick === o.k;
        return { title: o.title, sub: o.sub, pressed: on ? 'true' : 'false', pick: function () { self.setState({ pick: o.k }); },
          style: 'min-height: 72px; padding: 14px; border-radius: 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; font-family: Inter, sans-serif; background: #FFFFFF; ' + (on ? 'border: 2px solid #4F46E5;' : 'border: 1px solid #CBD5E1;') };
      }),
      go: function () { self.setState({ done: true }); },
      tour: [
        { n: 1, title: 'Check off a task', sub: 'Tap a status. It is saved with your name.' },
        { n: 2, title: 'See the timeline', sub: 'What happens when, and what decides the finish date.' },
        { n: 3, title: 'Read the Plan Check', sub: 'Free structure check, plus AI review when it is on.' },
        { n: 4, title: 'Share or export', sub: 'A read-only link, or an .ezplan file that keeps tracking anywhere.' }
      ]
    };
  }
}
</script>
</body>
</html>
