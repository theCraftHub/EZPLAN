# Cloud deployment config. Not deployed yet: needs the Cloudflare account (plan section 10).
name = "plans"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[d1_databases]]
binding = "DB"
database_name = "plans"
database_id = "set-after-creating-the-database"

[[r2_buckets]]
binding = "FILES"
bucket_name = "plans-files"

[durable_objects]
bindings = [{ name = "PLAN_ROOM", class_name = "PlanRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlanRoom"]

# The website (app/dist, built with `npm run build -w app`). Pages that aren't files get index.html;
# /api and /auth always reach the Worker. Security headers for pages are in app/public/_headers.
[assets]
directory = "../app/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]
